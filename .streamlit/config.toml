[theme]
primaryColor = "#0066CC"          # Warna biru tegas untuk tombol dan elemen aktif
backgroundColor = "#FFFFFF"       # Latar belakang putih bersih
secondaryBackgroundColor = "#F4F6F9" # Warna abu-abu sangat muda untuk sidebar/kotak input
textColor = "#111111"             # Warna teks hitam pekat agar sangat kontras dan mudah dibaca
font = "sans serif"               # Jenis font yang bersih dan modern
